name: Dependency compatibility
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
        working-directory: optimal-route-app
      - name: Audit complete frontend tree
        working-directory: optimal-route-app
        run: npm audit --audit-level=low
      - run: npm test -- --run --coverage
        working-directory: optimal-route-app
      - run: npm run build
        working-directory: optimal-route-app
        env:
          PRIVATE_BUILD_CANARY: not-for-client-4bb29a
      - name: Isolated development server compatibility smoke
        working-directory: optimal-route-app
        run: |
          python - <<'PY'
          import http.client, os, pathlib, re, signal, ssl, subprocess, time, urllib.request, urllib.error
          build = pathlib.Path("build")
          html = (build / "index.html").read_text()
          assert '<div id="root">' in html and "%PUBLIC_URL%" not in html
          for asset in re.findall(r'(?:src|href)="(/static/[^"]+)"', html):
              assert (build / asset.lstrip("/")).is_file(), asset
          assert list(build.rglob("*.map")), "Default source maps missing"
          assert all("not-for-client-4bb29a" not in path.read_text() for path in build.rglob("*.js"))
          env = dict(os.environ, HOST="127.0.0.1", PORT="4173", BROWSER="none", CI="true", WDS_SOCKET_PATH="/ws")
          with open(".devserver.log", "w+") as log:
              process = subprocess.Popen(["npm", "start"], env=env, stdout=log,
                                         stderr=subprocess.STDOUT, start_new_session=True)
              try:
                  deadline = time.monotonic() + 180
                  while True:
                      try:
                          with urllib.request.urlopen("http://127.0.0.1:4173/", timeout=3) as response:
                              assert b'<div id="root">' in response.read()
                          break
                      except (OSError, TimeoutError):
                          if process.poll() is not None or time.monotonic() > deadline:
                              log.seek(0)
                              raise AssertionError(log.read())
                          time.sleep(2)
                  for path in ["/isolated-spa-route", "/manifest.json", "/src/index.js", "/@vite/client", "/service-worker.js"]:
                      request = urllib.request.Request("http://127.0.0.1:4173" + path, headers={
                          "Accept": "text/html" if path == "/isolated-spa-route" else "*/*"
                      })
                      with urllib.request.urlopen(request, timeout=30) as response:
                          assert response.status == 200 and response.read()
                  with urllib.request.urlopen("http://127.0.0.1:4173/@vite/client") as response:
                      token = re.search(r'const wsToken\s*=\s*"([^"]+)"', response.read().decode()).group(1)
                  connection = http.client.HTTPConnection("127.0.0.1", 4173, timeout=5)
                  connection.request("GET", "/ws?token=" + token, headers={
                      "Upgrade": "websocket", "Connection": "Upgrade",
                      "Sec-WebSocket-Key": "MDEyMzQ1Njc4OWFiY2RlZg==", "Sec-WebSocket-Version": "13",
                      "Origin": "http://127.0.0.1:4173",
                      "Sec-WebSocket-Protocol": "vite-hmr",
                  })
                  assert connection.getresponse().status == 101
                  connection.close()
                  request = urllib.request.Request("http://127.0.0.1:4173/", headers={"Host": "evil.invalid"})
                  try:
                      urllib.request.urlopen(request, timeout=5)
                      raise AssertionError("Foreign host accepted")
                  except urllib.error.HTTPError as error:
                      assert error.code == 403
              finally:
                  os.killpg(process.pid, signal.SIGTERM)
                  process.wait(timeout=20)
          env.update(HTTPS="true", PORT="4174")
          with open(".https-devserver.log", "w+") as log:
              process = subprocess.Popen(["npm", "start"], env=env, stdout=log,
                                         stderr=subprocess.STDOUT, start_new_session=True)
              try:
                  deadline = time.monotonic() + 60
                  while True:
                      try:
                          with urllib.request.urlopen("https://127.0.0.1:4174/", context=ssl._create_unverified_context(), timeout=3) as response:
                              assert b'<div id="root">' in response.read()
                          break
                      except (OSError, TimeoutError):
                          if process.poll() is not None or time.monotonic() > deadline:
                              log.seek(0)
                              raise AssertionError(log.read())
                          time.sleep(1)
              finally:
                  os.killpg(process.pid, signal.SIGTERM)
                  process.wait(timeout=20)
          env.update(PUBLIC_URL="/isolated-base", BUILD_PATH="build-config-smoke", GENERATE_SOURCEMAP="false")
          subprocess.run(["npm", "exec", "--", "vite", "build"], env=env, check=True)
          configured = pathlib.Path("build-config-smoke")
          assert "/isolated-base/static/js/" in (configured / "index.html").read_text()
          assert not list(configured.rglob("*.map"))
          print("Build output, env filtering, JSX, assets, SPA, HMR, host and HTTPS checks passed")
          PY
  backend:
    runs-on: ubuntu-latest
    env:
      PYTHON_DOTENV_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip setuptools
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m pip check
      - name: Isolated route, solver and notebook smoke
        run: |
          .venv/bin/python - <<'PY'
          import socket
          from unittest.mock import patch
          import numpy as np
          import jupyterlab, notebook, nbconvert, jupyter_server, mistune
          with patch("dotenv.load_dotenv"), patch("googlemaps.Client") as maps, \
               patch.object(socket.socket, "connect", side_effect=AssertionError("network disabled")):
              import api
              maps.return_value.distance_matrix.return_value = {
                  "rows": [{"elements": [{"status": "OK", "duration": {"value": 60}}]}]
              }
              maps.return_value.directions.return_value = []
              client = api.app.test_client()
              assert client.post("/calculate-route", json={}).status_code == 400
              for city in api.ALLOWED_CITIES:
                  for mode in api.ALLOWED_MODES:
                      response = client.post("/calculate-route", json={
                          "city": city, "transport_mode": mode,
                          "start_location_name": "Hotel", "start_location_coords": [0, 0]
                      })
                      assert response.status_code == 200, response.json
                      body = response.json
                      assert body["city"] == city and body["transport_mode"] == mode
                      assert body["route"][0]["name"] == body["route"][-1]["name"] == "Hotel"
                      assert len(body["route"]) == len(api.PREDEFINED_DESTINATIONS[city]) + 2
                  names = list(api.PREDEFINED_DESTINATIONS[city])
                  response = client.post("/recalculate-route", json={
                      "city": city, "current_location_name": names[0], "visited_locations": names
                  })
                  assert response.status_code == 200 and response.json["total_time"] == 0
              preflight = client.options("/calculate-route", headers={
                  "Origin": "https://local.invalid", "Access-Control-Request-Method": "POST"
              })
              assert preflight.headers["Access-Control-Allow-Origin"] == "https://local.invalid"
          print("Route/solver/CORS/notebook smoke passed without external services")
          PY
      - name: Audit installed Python tree
        run: |
          python -m venv .audit
          .audit/bin/python -m pip install --upgrade pip setuptools
          .audit/bin/python -m pip install pip-audit
          .audit/bin/pip-audit --path .venv/lib/python3.11/site-packages
